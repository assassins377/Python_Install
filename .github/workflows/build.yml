name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Скачиваем код
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Устанавливаем Python 3.10
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.10'

    - name: Устанавливаем ruff
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Проверяем линтером
      run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
    - name: Скачиваем код
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Устанавливаем Python 3.10
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.10'

    - name: Устанавливаем mypy
      run: |
        python -m pip install --upgrade pip
        pip install mypy

    - name: Проверяем типами
      run: |
        mypy --ignore-missing-imports .
        mypy --ignore-missing-imports --platform win32 .

  security:
    runs-on: ubuntu-latest
    steps:
    - name: Скачиваем код
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Устанавливаем Python 3.10
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.10'

    - name: Устанавливаем bandit
      run: |
        python -m pip install --upgrade pip
        pip install bandit

    - name: Сканируем безопасность
      run: bandit -r . -x ./tests,./tools,./.venv,./build,./dist -ll

  test:
    # Тесты гоняем на обеих ОС: проект — кросс-платформенный (Windows + Linux),
    # и платформенная логика (диспетчеризация команд, фильтрация по ОС)
    # ведёт себя по-разному. Юнит-тесты не требуют wxPython — ставим минимум.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Скачиваем код
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Устанавливаем Python 3.10
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.10'

    - name: Устанавливаем зависимости
      run: |
        python -m pip install --upgrade pip
        pip install psutil pytest pytest-cov

    - name: Запускаем тесты с покрытием
      run: python -m pytest tests/ -v --tb=short --cov --cov-report=term-missing --cov-report=xml

    - name: Проверяем порог покрытия
      run: python -m coverage report --fail-under=40

    - name: Загружаем отчёт о покрытии (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: coverage-xml
        path: coverage.xml

  build:
    needs: [lint, typecheck, security, test]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            python-arch: x86
          - arch: x64
            python-arch: x64
    name: Build ${{ matrix.arch }}
    steps:
    - name: Скачиваем код
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Устанавливаем ${{ matrix.arch }} Python 3.10
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.10'
        architecture: ${{ matrix.python-arch }}

    - name: Устанавливаем библиотеки
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow
        pip install -r requirements.txt

    - name: Проверяем Windows-обновление и завершение GUI
      run: python tools/check_windows_runtime.py

    - name: Собираем EXE и portable с ресурсами и SHA-256
      run: python tools/build_windows.py --arch ${{ matrix.arch }}

    - name: Проверяем готовые сборки из чистой папки
      run: python tools/smoke_windows.py --arch ${{ matrix.arch }}

    - name: Загружаем артефакт
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: MInstAll_${{ matrix.arch }}_Executable
        path: |
          dist/MInstAll_${{ matrix.arch }}.exe
          dist/MInstAll_${{ matrix.arch }}.exe.sha256
          dist/MInstAll_${{ matrix.arch }}_portable.zip
          dist/MInstAll_${{ matrix.arch }}_portable.zip.sha256
          dist/smoke-${{ matrix.arch }}.json
        if-no-files-found: error

  verify-artifacts:
    # Exercise the release upload/download path on PRs without publishing a release.
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.10'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: MInstAll_x86_Executable
        path: dist/
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: MInstAll_x64_Executable
        path: dist/
    - name: Проверяем контрольные суммы и комплектность обоих пакетов
      run: python tools/verify_artifacts.py dist
